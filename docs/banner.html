<!doctype html>
<!--
  The README banner: the wordmark with a crumb trail spilling out of the "o".
  Rendered with headless Chrome — see docs/README.md.

  The crumbs are positioned at render time from the measured bounding box of the "o", so
  they stay attached to the glyph if the type size or font ever changes.
-->
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  .banner {
    position: relative;
    width: 1200px; height: 350px;
    box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(760px 380px at 20% 118%, rgba(219,162,79,.20), transparent 62%),
      radial-gradient(560px 300px at 86% -18%, rgba(232,178,104,.10), transparent 60%),
      #14100C;
    font-family: Lato, "DejaVu Sans", sans-serif;
    overflow: hidden;
  }
  .word {
    position: relative; z-index: 2;
    font-weight: 900; font-size: 124px; line-height: 1;
    letter-spacing: -4px; color: #FFFFFF;
  }
  .tag {
    margin-top: 30px; position: relative; z-index: 2;
    font-weight: 300; font-size: 27px; color: rgba(255,255,255,.80);
  }
  .tag b { font-weight: 600; color: #FFFFFF; }
  #crumbs { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
</style>

<div class="banner">
  <svg id="crumbs" width="1200" height="350" viewBox="0 0 1200 350">
    <defs>
      <path id="cA" d="M-0.893,-0.325 L-0.366,-0.689 L0.519,-0.831 L0.812,-0.114
                       L0.695,0.719 L-0.291,0.799 L-0.795,0.423 Z"/>
      <path id="cB" d="M-0.674,-0.566 L-0.083,-0.946 L0.613,-0.514 L0.937,0.251
                       L0.260,0.799 L-0.707,0.707 L-0.757,0.066 Z"/>
      <path id="cC" d="M-0.891,-0.125 L-0.212,-0.792 L0.707,-0.707 L0.733,0.267
                       L0.080,0.916 L-0.529,0.678 Z"/>
    </defs>
  </svg>

  <div class="word">K<span id="oh">o</span>miter</div>
  <div class="tag">Your Spark streaming jobs, leaving a trail <b>Kafka</b> can follow.</div>
</div>

<script>
  // Seeded PRNG so the trail is identical on every render.
  let seed = 20260825;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

  const DARK  = ["#B0762F", "#C08438", "#CC9042"];
  const MID   = ["#DBA24F", "#E6B061"];
  const LIGHT = ["#F0C384", "#F8D9A6"];
  const SHAPES = ["cA", "cB", "cC"];
  const pick = a => a[Math.floor(rnd() * a.length)];
  const tone = t => t < 0.3 ? pick(DARK) : t < 0.65 ? pick(MID) : pick(LIGHT);

  const svg = document.getElementById('crumbs');
  const host = svg.getBoundingClientRect();
  const o = document.getElementById('oh').getBoundingClientRect();

  // Start just inside the top-right of the "o" and arc up and to the right, clearing the
  // rest of the wordmark rather than sitting on top of it.
  const x0 = o.left - host.left + o.width * 0.80;
  const y0 = o.top - host.top + o.height * 0.22;
  const P0 = [x0, y0], P1 = [x0 + 125, y0 - 58], P2 = [x0 + 385, y0 - 92];
  const bez = t => {
    const u = 1 - t;
    return [u * u * P0[0] + 2 * u * t * P1[0] + t * t * P2[0],
            u * u * P0[1] + 2 * u * t * P1[1] + t * t * P2[1]];
  };
  const norm = t => {
    const u = 1 - t;
    const dx = 2 * u * (P1[0] - P0[0]) + 2 * t * (P2[0] - P1[0]);
    const dy = 2 * u * (P1[1] - P0[1]) + 2 * t * (P2[1] - P1[1]);
    const n = Math.hypot(dx, dy) || 1;
    return [-dy / n, dx / n];
  };

  const placed = [];
  const clashes = (x, y, r, gap) => placed.some(p =>
    Math.hypot(x - p[0], y - p[1]) < (r + p[2]) * gap);

  const add = (x, y, s, t, op) => {
    const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    u.setAttribute('href', '#' + pick(SHAPES));
    u.setAttribute('transform',
      `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(rnd() * 360).toFixed(0)}) ` +
      `scale(${(s * (0.9 + rnd() * 0.2)).toFixed(2)},${(s * (0.85 + rnd() * 0.2)).toFixed(2)})`);
    u.setAttribute('fill', tone(t));
    if (op < 0.99) u.setAttribute('opacity', op.toFixed(2));
    svg.appendChild(u);
    placed.push([x, y, s]);
  };

  // Primaries carry the trail; the scatter fills it in, densest where it leaves the "o".
  for (let i = 0; i < 9; i++) {
    const t = i / 8;
    const base = 11.5 * Math.pow(1 - t, 1.05) + 2.2;
    for (let k = 0; k < 60; k++) {
      const [bx, by] = bez(t), [nx, ny] = norm(t);
      const off = (rnd() - 0.5) * 9;
      const x = bx + nx * off, y = by + ny * off;
      if (!clashes(x, y, base, 0.9)) { add(x, y, base, t, 1); break; }
    }
  }
  let n = 0;
  for (let k = 0; k < 900 && n < 46; k++) {
    const t = Math.pow(rnd(), 1.7);
    const [bx, by] = bez(t), [nx, ny] = norm(t);
    const spread = 9 + 16 * t;
    const x = bx + nx * (rnd() + rnd() + rnd() - 1.5) * spread + (rnd() - 0.5) * 9;
    const y = by + ny * (rnd() + rnd() + rnd() - 1.5) * spread;
    const s = (5.2 * Math.pow(1 - t, 1.25) + 1.0) * (0.5 + rnd() * 0.5);
    if (x < 6 || x > 1194 || y < 8 || y > 344) continue;
    if (clashes(x, y, s, 0.95)) continue;
    add(x, y, s, t, 0.68 + rnd() * 0.32);
    n++;
  }
  document.title = 'BANNER_READY';
</script>
